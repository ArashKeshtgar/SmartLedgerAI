# Local dev stack for the event-driven-messaging path: a real RabbitMQ broker,
# the Function (publisher), and the AnomalyNotifier (consumer). Azurite stands
# in for AzureWebJobsStorage so the Functions host has somewhere to keep its
# bookkeeping without needing a real Azure Storage account.
#
# SqlConnectionString / OPENAI_* are left unset here on purpose — this stack
# proves the messaging path, not the SQL/OpenAI path, which needs real
# credentials this repo never commits.
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

  functions:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      azurite:
        condition: service_started
    ports:
      - "7071:80"
    environment:
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      FUNCTIONS_WORKER_RUNTIME: "dotnet-isolated"
      RabbitMqConnectionString: "amqp://guest:guest@rabbitmq:5672"

  notifier:
    build:
      context: .
      dockerfile: src/SmartLedgerAI.AnomalyNotifier/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RabbitMqConnectionString: "amqp://guest:guest@rabbitmq:5672"
