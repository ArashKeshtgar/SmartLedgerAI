name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: |
          dotnet restore src/SmartLedgerAI.Functions/SmartLedgerAI_Functions.csproj
          dotnet restore src/SmartLedgerAI.AnomalyNotifier/SmartLedgerAI.AnomalyNotifier.csproj

      - name: Build
        run: |
          dotnet build src/SmartLedgerAI.Functions/SmartLedgerAI_Functions.csproj -c Release --no-restore
          dotnet build src/SmartLedgerAI.AnomalyNotifier/SmartLedgerAI.AnomalyNotifier.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/SmartLedgerAI.Functions.Tests/SmartLedgerAI.Functions.Tests.csproj -c Release

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build functions container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: smartledgerai-functions:ci

      - name: Build notifier container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/SmartLedgerAI.AnomalyNotifier/Dockerfile
          push: false
          tags: smartledgerai-notifier:ci
