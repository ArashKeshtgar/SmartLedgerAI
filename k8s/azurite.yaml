apiVersion: apps/v1
kind: Deployment
metadata:
  name: azurite
  namespace: smartledgerai
spec:
  replicas: 1
  selector:
    matchLabels: { app: azurite }
  template:
    metadata:
      labels: { app: azurite }
    spec:
      containers:
        - name: azurite
          image: mcr.microsoft.com/azure-storage/azurite
          args: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0"]
          ports:
            - containerPort: 10000
            - containerPort: 10001
            - containerPort: 10002
---
apiVersion: v1
kind: Service
metadata:
  name: azurite
  namespace: smartledgerai
spec:
  selector: { app: azurite }
  ports:
    - name: blob
      port: 10000
    - name: queue
      port: 10001
    - name: table
      port: 10002
