apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: smartledgerai
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: smartledgerai
spec:
  selector: { app: rabbitmq }
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
