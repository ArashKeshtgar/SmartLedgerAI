apiVersion: apps/v1
kind: Deployment
metadata:
  name: functions
  namespace: smartledgerai
spec:
  replicas: 1
  selector:
    matchLabels: { app: functions }
  template:
    metadata:
      labels: { app: functions }
    spec:
      containers:
        - name: functions
          image: repo-functions:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: AzureWebJobsStorage
              value: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
            - name: FUNCTIONS_WORKER_RUNTIME
              value: "dotnet-isolated"
            - name: RabbitMqConnectionString
              value: "amqp://guest:guest@rabbitmq:5672"
---
apiVersion: v1
kind: Service
metadata:
  name: functions
  namespace: smartledgerai
spec:
  selector: { app: functions }
  ports:
    - port: 80
